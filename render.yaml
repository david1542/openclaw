services:
  - type: pserv
    name: openclaw
    runtime: docker
    plan: standard
    dockerCommand: /bin/sh /app/render-entrypoint.sh
    envVars:
      - key: PORT
        value: "8080"
      - key: OPENCLAW_STATE_DIR
        value: /data/.openclaw
      - key: OPENCLAW_WORKSPACE_DIR
        value: /data/workspace
      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true
      - key: NODE_OPTIONS
        value: "--max-old-space-size=1200"
    disk:
      name: openclaw-data
      mountPath: /data
      sizeGB: 1